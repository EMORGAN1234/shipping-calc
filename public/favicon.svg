<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Background -->
  <rect width="32" height="32" rx="6" fill="#1a1a1a"/>

  <!-- Box body (front face) -->
  <polygon points="5,13 16,19 27,13 16,7" fill="#dc2626"/>

  <!-- Box left face -->
  <polygon points="5,13 5,23 16,29 16,19" fill="#991b1b"/>

  <!-- Box right face -->
  <polygon points="27,13 27,23 16,29 16,19" fill="#b91c1c"/>

  <!-- Tape stripe across top face -->
  <polygon points="11.5,10 16,12.4 20.5,10 16,7.6" fill="#f87171" opacity="0.6"/>

  <!-- Tape stripe down front-left seam -->
  <line x1="16" y1="19" x2="16" y2="29" stroke="#f87171" stroke-width="1.2" opacity="0.5"/>
</svg>
